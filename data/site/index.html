<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Загрузка изображения</h2>
    
    <!-- Форма загрузки -->
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" onchange="load(this)">
    <button onclick="uploadFile()">Загрузить</button>
    
    <div id="status"></div>
    
    <hr>
    
    <!-- Просмотр -->
    <img id="preview" src="/cool.jpg" alt="Превью">
    
    <input type="button" value="Просмотреть файлы" onclick="listFS()">

    <section id="files">

    </section>

    <script src="main.js"></script>
</body>
</html>
